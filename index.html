<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>神助理保單服務</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #f5f7f6;
      color: #333;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    .card {
      max-width: 520px;
      margin: 50px auto;
      padding: 32px 22px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #06c755;
      font-size: 28px;
    }

    #status {
      margin-top: 24px;
      white-space: pre-line;
      line-height: 1.8;
      font-size: 18px;
    }

    #agent {
      margin-top: 16px;
      color: #666;
      font-size: 16px;
    }

    .success {
      color: #07883c;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>神助理保單服務</h1>

    <div id="status">
      GitHub 網頁已載入，正在連接 LINE……
    </div>

    <div id="agent"></div>
  </main>

  <script>
    const LIFF_ID = '2009625468-abe9aOhu';

    const statusElement = document.getElementById('status');
    const agentElement = document.getElementById('agent');

    function showStatus(message, className = '') {
      statusElement.textContent = message;
      statusElement.className = className;
    }

    async function startLiff() {
      try {
        showStatus('步驟 1／4：LIFF SDK 已載入');

        await liff.init({
          liffId: LIFF_ID
        });

        showStatus('步驟 2／4：LINE 初始化成功');

        if (!liff.isLoggedIn()) {
          showStatus('步驟 3／4：正在前往 LINE 登入……');

          liff.login({
            redirectUri: window.location.href
          });

          return;
        }

        showStatus('步驟 4／4：正在讀取 LINE 身分……');

        const profile = await liff.getProfile();
        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error('未取得 LINE 身分憑證，請確認 openid 權限');
        }

        const parameters = new URL(window.location.href).searchParams;
        const agentCode = parameters.get('agent') || '尚未指定';

        showStatus(
          'LINE 身分連接成功！\n您好，' + profile.displayName,
          'success'
        );

        agentElement.textContent =
          '業務員代碼：' + agentCode;

      } catch (error) {
        console.error(error);

        showStatus(
          'LINE 連接失敗\n' + error.message,
          'error'
        );
      }
    }

    startLiff();
  </script>
</body>
</html>
