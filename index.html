<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>神助理｜客戶身分綁定</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 18px;
      background: #f4f7f5;
      color: #333333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 24px auto;
    }

    .card {
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #168c5b;
      color: #ffffff;
      font-size: 27px;
      font-weight: bold;
      line-height: 62px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: #168c5b;
      font-size: 25px;
      text-align: center;
    }

    .description {
      margin: 0 0 22px;
      color: #666666;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
    }

    .status {
      margin-bottom: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #eef7f2;
      color: #276749;
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    .status.error {
      background: #fff0f0;
      color: #b83232;
    }

    .form-area {
      display: none;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      background: #ffffff;
      color: #333333;
      font-size: 17px;
    }

    input:focus {
      border-color: #168c5b;
      outline: none;
      box-shadow: 0 0 0 3px rgba(22, 140, 91, 0.12);
    }

    .hint {
      margin-top: 6px;
      color: #777777;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      background: #168c5b;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #a8b8b0;
      cursor: not-allowed;
    }

    .privacy {
      margin: 18px 4px 0;
      color: #777777;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <div class="logo">神</div>

      <h1>客戶身分綁定</h1>

      <p class="description">
        為了讓您安全查詢自己的保單健檢資料，
        請先完成身分資料確認。
      </p>

      <div id="statusMessage" class="status">
        正在連接 LINE，請稍候……
      </div>

      <div id="formArea" class="form-area">
                <!-- 已綁定客戶查閱 PDF -->
        <form
          id="pdfForm"
          method="post"
          action="https://script.google.com/macros/s/AKfycbw4t8XnHO4d97TRLHULGn1UZ2lBbYWpVC4PgD1xiQwBrFN2adAP_sc-S3HUX7NkqpjJDg/exec"
        >
          <input
            name="action"
            type="hidden"
            value="viewPdf"
          >

          <input
            id="pdfAgentCode"
            name="agentCode"
            type="hidden"
          >

          <input
            id="pdfIdToken"
            name="idToken"
            type="hidden"
          >

          <button
            id="viewPdfButton"
            type="submit"
          >
            查看我的保單健檢
          </button>
        </form>

        <div
          style="
            margin: 24px 0 20px;
            padding-top: 20px;
            border-top: 1px solid #dddddd;
            color: #666666;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
          "
        >
          尚未完成綁定嗎？請填寫以下資料
        </div>
        <form
          id="bindingForm"
          method="post"
          action="https://script.google.com/macros/s/AKfycbw4t8XnHO4d97TRLHULGn1UZ2lBbYWpVC4PgD1xiQwBrFN2adAP_sc-S3HUX7NkqpjJDg/exec"
        >
          <input
            id="agentCode"
            name="agentCode"
            type="hidden"
          >

          <input
            id="idToken"
            name="idToken"
            type="hidden"
          >

          <div class="field">
            <label for="customerName">姓名</label>

            <input
              id="customerName"
              name="customerName"
              type="text"
              autocomplete="name"
              maxlength="30"
              placeholder="請輸入客戶資料表中的姓名"
              required
            >
          </div>

          <div class="field">
            <label for="birthday">生日</label>

            <input
              id="birthday"
              name="birthday"
              type="date"
              required
            >

            <div class="hint">
              請選擇西元出生年月日。
            </div>
          </div>

          <div class="field">
            <label for="mobileLast4">手機末四碼</label>

            <input
              id="mobileLast4"
              name="mobileLast4"
              type="tel"
              inputmode="numeric"
              autocomplete="off"
              minlength="4"
              maxlength="4"
              pattern="[0-9]{4}"
              placeholder="例如：1234"
              required
            >

            <div class="hint">
              請輸入留存在保險顧問客戶資料中的手機末四碼。
            </div>
          </div>

          <button id="submitButton" type="submit">
            確認並綁定 LINE
          </button>
        </form>

        <p class="privacy">
          系統只會將經 LINE 官方驗證的帳號，
          綁定到符合姓名、生日及手機末四碼的客戶資料。
        </p>
      </div>
    </section>
  </main>

  <script>
    const LIFF_ID = '2009625468-abe9aOhu';

    const statusMessage =
      document.getElementById('statusMessage');

    const formArea =
      document.getElementById('formArea');

    const bindingForm =
      document.getElementById('bindingForm');

    const agentCodeInput =
      document.getElementById('agentCode');

    const idTokenInput =
      document.getElementById('idToken');

    const mobileLast4Input =
      document.getElementById('mobileLast4');

    const submitButton =
      document.getElementById('submitButton');
        const pdfForm =
      document.getElementById('pdfForm');

    const pdfAgentCodeInput =
      document.getElementById('pdfAgentCode');

    const pdfIdTokenInput =
      document.getElementById('pdfIdToken');

    const viewPdfButton =
      document.getElementById('viewPdfButton');

    function showError(message) {
      statusMessage.textContent = message;
      statusMessage.classList.add('error');
      formArea.style.display = 'none';
    }

    function getAgentCode() {
      const parameters =
        new URLSearchParams(window.location.search);

      return String(
        parameters.get('agent') || ''
      ).trim().toUpperCase();
    }

async function initializeLiff() {
  try {
    /*
     * 必須先完成 LIFF 初始化。
     * LINE 完成轉址後，網址中的 agent 才會恢復。
     */
    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login({
        redirectUri: window.location.href
      });
      return;
    }

    // LIFF 初始化完成後，再讀取業務員代碼
    const agentCode = getAgentCode();

    if (!/^[A-Z0-9_-]{1,20}$/.test(agentCode)) {
      showError(
        '此連結缺少正確的業務員代碼，請向保險顧問索取新的連結。'
      );
      return;
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      showError(
        '目前無法取得 LINE 身分憑證，請關閉頁面後重新開啟。'
      );
      return;
    }

    agentCodeInput.value = agentCode;
    idTokenInput.value = idToken;

            pdfAgentCodeInput.value = agentCode;
        pdfIdTokenInput.value = idToken;
    
    let greeting = 'LINE 身分連接成功';

    try {
      const profile = await liff.getProfile();

      if (profile && profile.displayName) {
        greeting =
          `您好，${profile.displayName}，LINE 身分連接成功`;
      }
    } catch (profileError) {
      // 即使沒有取得暱稱，仍可繼續綁定。
    }

    statusMessage.textContent =
      `${greeting}｜業務員代碼：${agentCode}`;

    statusMessage.classList.remove('error');
    formArea.style.display = 'block';

  } catch (error) {
    console.error(error);

    showError(
      'LINE 連接失敗，請關閉頁面後，從 LINE 重新開啟。'
    );
  }
}
        pdfForm.addEventListener('submit', function (event) {
      const newIdToken = liff.getIDToken();

      if (!newIdToken) {
        event.preventDefault();

        showError(
          'LINE 身分憑證已失效，請關閉頁面後重新開啟。'
        );
        return;
      }

      pdfIdTokenInput.value = newIdToken;

      viewPdfButton.disabled = true;

      viewPdfButton.textContent =
        '正在安全開啟 PDF，請稍候……';

      statusMessage.textContent =
        '正在驗證 LINE 身分並讀取您的保單健檢資料。';
    });
    
    mobileLast4Input.addEventListener('input', function () {
      this.value = this.value
        .replace(/\D/g, '')
        .slice(0, 4);
    });

    bindingForm.addEventListener('submit', function (event) {
      const newIdToken = liff.getIDToken();

      if (!newIdToken) {
        event.preventDefault();

        showError(
          'LINE 身分憑證已失效，請關閉頁面後重新開啟。'
        );
        return;
      }

      idTokenInput.value = newIdToken;

      submitButton.disabled = true;
      submitButton.textContent = '正在確認資料，請稍候……';

      statusMessage.textContent =
        '正在安全驗證您的資料，請勿重複操作。';
    });

    initializeLiff();
  </script>
</body>
</html>
新增已綁定客戶 PDF 查閱按鈕
